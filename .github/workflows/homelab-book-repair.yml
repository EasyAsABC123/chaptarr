name: Homelab Book Repair
on:
  push:
    branches: [fix/durable-book-requests]
permissions:
  contents: read
  packages: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: cache-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.403
      - name: Test exact production baseline and durable contracts
        env:
          CHAPTARR_TEST_POSTGRES_CONNECTION_STRING: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=cache-test-only
        run: dotnet test src/Chaptarr.Core.Test/Chaptarr.Core.Test.csproj --configuration Release -p:TreatWarningsAsErrors=false
      - name: Stage only the verified runtime assemblies
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          mkdir -p .homelab-image
          cp _output/net10.0/Chaptarr.Core.dll _output/net10.0/Chaptarr.Core.pdb _output/net10.0/Chaptarr.Http.dll _output/net10.0/Chaptarr.Http.pdb .homelab-image/
          jq -n --arg commit "$SOURCE_REVISION" '{commit: $commit, baseline: "e67374f4b3fed01bbf08f18672add944062fcb49", cacheMigration: 129}' > .homelab-image/build.json
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: image
        with:
          context: .
          file: deploy/homelab/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/easyasabc123/chaptarr-homelab:sha-${{ github.sha }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          provenance: false
      - name: Report immutable image
        run: echo 'ghcr.io/easyasabc123/chaptarr-homelab@${{ steps.image.outputs.digest }}'
